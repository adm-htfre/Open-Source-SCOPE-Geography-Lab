<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Geography Lab Term 2 Lessons</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500&family=Archivo:wght@600;700;800;900&family=Mukta:wght@400;500;600;700;800&family=Tiro+Devanagari+Marathi:ital@0;1&display=swap">
<style>
/* Layout: a lesson board on warm grid paper — eyebrow, serif headline with a highlighter word, outlined cards, black fact chips, a lesson rail along the bottom */
:root{
  --paper:#ebe6da; --paper-hi:#f6f2e8; --grid:rgba(40,36,28,.05); --ink:#15171c; --muted:#6b675d; --line:#d8d1c1;
  --card:#fbf9f4; --soft:#f2eee4; --hl:#f7d548; --chip:#15171c; --chip-ink:#fff;
  --blue:#3b6fd6; --red:#d1543a; --green:#2f8a4f; --amber:#c9822a; --rail:#f8f5ee;
  --f-serif:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --f-sans:"Archivo","Mukta","Arial Narrow",system-ui,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1b1a17; --paper-hi:#25231f; --grid:rgba(255,248,230,.045); --ink:#f1ece0; --muted:#a9a293; --line:#3b382f;
  --card:#23211d; --soft:#2a2823; --hl:#e8c234; --chip:#f1ece0; --chip-ink:#15171c;
  --blue:#6f9bf0; --red:#ec7c62; --green:#5cc483; --amber:#e8a650; --rail:#23211d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1b1a17; --paper-hi:#25231f; --grid:rgba(255,248,230,.045); --ink:#f1ece0; --muted:#a9a293; --line:#3b382f;
  --card:#23211d; --soft:#2a2823; --hl:#e8c234; --chip:#f1ece0; --chip-ink:#15171c;
  --blue:#6f9bf0; --red:#ec7c62; --green:#5cc483; --amber:#e8a650; --rail:#23211d; color-scheme:dark}
html[lang="mr"]{--f-serif:"Tiro Devanagari Marathi","Noto Serif Devanagari",serif; --f-sans:"Mukta","Noto Sans Devanagari",sans-serif}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-serif);font-size:17px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;
  background:radial-gradient(ellipse 70% 55% at 50% 35%, var(--paper-hi), transparent 70%) fixed,
  linear-gradient(var(--grid) 1px, transparent 1px) 0 0/28px 28px, linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/28px 28px, var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
mark{background:var(--hl);color:#15171c;padding:0 .14em;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.wrap{width:100%;max-width:1180px;margin:0 auto;box-sizing:border-box;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.lab,.eyebrow,.chip,.tag,.btn,.rail,.seg button,.g-chip,.k{font-family:var(--f-sans)}
.eyebrow{font-weight:800;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
h1{font-weight:700;font-size:clamp(32px,5vw,56px);line-height:1.1;letter-spacing:-.01em;margin:4px 0 0;text-wrap:balance}
h2{font-weight:700;font-size:clamp(22px,2.6vw,30px);line-height:1.15;margin:0;text-wrap:balance}
html[lang="mr"] h1,html[lang="mr"] h2,html[lang="mr"] h3{font-weight:400;line-height:1.35}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;padding-block:22px 12px;border-bottom:2px solid var(--ink)}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:6px 12px;font-weight:800;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip{display:inline-block;font-weight:800;font-size:clamp(13px,1.5vw,15.5px);letter-spacing:.04em;text-transform:uppercase;background:var(--chip);color:var(--chip-ink);padding:6px 11px;border-radius:4px}
.tag{display:inline-block;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#fff;padding:3px 8px;border-radius:2px}
.quote{border:2px solid var(--ink);background:var(--card);padding:6px 12px;border-radius:2px;font-size:18px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:12px;box-shadow:0 2px 0 rgba(0,0,0,.06),0 12px 26px -16px rgba(60,45,15,.4)}
.btn{text-decoration:none;display:inline-block;border:2px solid var(--chip);background:var(--chip);color:var(--chip-ink);border-radius:4px;font-weight:800;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;padding:8px 13px;transition:transform .2s var(--ease),background .25s var(--ease)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--ink)}
.btn:active{transform:scale(.97)}
html[lang="mr"] .eyebrow,html[lang="mr"] .chip,html[lang="mr"] .tag,html[lang="mr"] .btn,html[lang="mr"] .rail *,html[lang="mr"] .g-chip,html[lang="mr"] .k{letter-spacing:0!important;text-transform:none!important}
html[lang="mr"] .chip{font-weight:700;font-size:16px;padding:5px 11px 3px}
html[lang="mr"] .btn{font-size:15px;font-weight:700}

/* home */
.home-intro{padding-block:22px 6px;max-width:68ch;color:var(--muted);font-style:italic}
html[lang="mr"] .home-intro{font-style:normal}
.weeks{display:flex;flex-direction:column;gap:22px;padding-block:14px 40px}
.week h3{font-family:var(--f-sans);font-weight:900;font-size:13px;letter-spacing:.18em;text-transform:uppercase;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.week h3::after{content:"";flex:1;height:2px;background:var(--ink);opacity:.25}
.lcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.lcard{display:flex;flex-direction:column;gap:8px;padding:16px 18px;text-decoration:none;color:inherit;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.lcard:hover{transform:translateY(-3px)}
.lcard h2{font-size:24px}
.lcard p{margin:0;color:var(--muted);font-size:15.5px}
.lcard .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.g-chip{font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--ink);border-radius:3px;padding:2px 7px}

/* lesson */
.stage{flex:1;padding-block:clamp(22px,4vw,44px) 120px;display:flex;flex-direction:column;gap:20px}
.slide{display:flex;flex-direction:column;gap:20px}
.slide.enter>*{animation:rise .5s var(--ease) both}
.slide.enter>*:nth-child(2){animation-delay:.05s}.slide.enter>*:nth-child(3){animation-delay:.1s}.slide.enter>*:nth-child(4){animation-delay:.15s}.slide.enter>*:nth-child(5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.lead{font-size:clamp(18px,2vw,22px);max-width:62ch;margin:0}
.row{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-start}
.place{display:flex;gap:16px;align-items:center;padding:12px 22px 12px 12px;min-width:0}
.ring{flex:none;width:86px;height:86px;border-radius:50%;border:4px solid var(--ring);background:var(--paper);display:grid;place-items:center;overflow:hidden}
.ring svg{width:66px;height:66px}.ring path{fill:var(--ink)}
.place h2{font-size:clamp(22px,2.4vw,28px)}
.meta{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.meta em{color:var(--muted);font-size:15.5px}
.facts{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding-top:8px}
.pts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.pt{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.pt .k{font-weight:900;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pt h3{margin:0;font-size:22px;font-weight:700;line-height:1.2}
.pt p{margin:0;font-size:16px}
.cmp{padding:16px 18px;display:flex;flex-direction:column;gap:14px;max-width:820px}
.cmp-row{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:6px 14px;align-items:center}
@media (max-width:560px){.cmp-row{grid-template-columns:minmax(0,1fr)}}
.cmp-row>b{font-family:var(--f-sans);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
html[lang="mr"] .cmp-row>b{letter-spacing:0;text-transform:none;font-size:15px}
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:grid;grid-template-columns:minmax(0,110px) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:15px}
.bar .tr{height:16px;background:var(--soft);border:1.5px solid var(--ink);border-radius:2px;overflow:hidden}
.bar .tr i{display:block;height:100%;transform-origin:left;animation:growX .8s var(--ease) both}
.bar .v{font-family:var(--f-sans);font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.src{font-style:italic;color:var(--muted);font-size:14.5px;margin:0;max-width:72ch}
html[lang="mr"] .src{font-style:normal}

/* widgets */
.widget{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.lgrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px;max-width:420px;aspect-ratio:1;border:2px solid var(--ink);background:var(--ink);touch-action:manipulation}
.lgrid button{border:0;padding:0;background:var(--soft);transition:background .2s var(--ease)}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.pal button{display:flex;gap:6px;align-items:center;border:2px solid var(--ink);background:var(--card);border-radius:4px;padding:4px 9px;font-family:var(--f-sans);font-weight:700;font-size:13px}
.pal button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink);background:var(--hl);color:#15171c}
.pal i{width:14px;height:14px;border:1.5px solid var(--ink);border-radius:2px;display:inline-block}
.wflex{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.wflex>*{min-width:0}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tally div{border:1.5px solid var(--ink);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.tally span{font-family:var(--f-sans);font-weight:700;font-size:13px}
.tally .ctl{display:flex;gap:6px;align-items:center}
.tally .ctl button{width:34px;height:34px;border:2px solid var(--ink);border-radius:4px;background:var(--card);font-weight:900;font-size:18px}
.tally output{font-family:var(--f-serif);font-weight:700;font-size:24px;min-width:2ch;text-align:center}
.big{font-weight:700;font-size:clamp(26px,3vw,36px);line-height:1.1}
.idl-ctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-family:var(--f-sans);font-weight:700;font-size:14px}
.idl-ctl input[type=range]{width:min(320px,70vw);accent-color:var(--blue)}
.idl-wrap{overflow-x:auto}
.idl{display:grid;grid-template-columns:repeat(25,minmax(52px,1fr));min-width:1100px;border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.idl div{padding:6px 2px;text-align:center;font-family:var(--f-sans);font-size:12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;transition:background .3s var(--ease)}
.idl div b{font-size:13.5px;font-variant-numeric:tabular-nums}
.idl div.d0{background:color-mix(in srgb, var(--blue) 18%, var(--card))}
.idl div.d1{background:color-mix(in srgb, var(--hl) 45%, var(--card))}
.idl div.dm{background:color-mix(in srgb, var(--red) 16%, var(--card))}
.idl div.ist{box-shadow:inset 0 0 0 2px var(--ink)}
.sort{display:flex;flex-direction:column;gap:6px}
.sort .it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:5px 0}
.sort .it>span{font-size:16px}
.sort .opts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.sort .opts button{border:1.5px solid var(--ink);border-radius:3px;background:var(--card);font-family:var(--f-sans);font-weight:700;font-size:12px;padding:3px 8px;transition:background .2s var(--ease)}
.sort .opts button.ok{background:var(--green);border-color:var(--green);color:#fff}
.sort .opts button.no{background:var(--red);border-color:var(--red);color:#fff}
.pattern{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
.pattern .card{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pattern svg{width:100%;height:auto;border:1.5px solid var(--ink);border-radius:6px;background:var(--soft)}

/* quiz */
.q{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.q h3{margin:0;font-size:20px;font-weight:700}
.q .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px}
.q .opts button{text-align:left;border:2px solid var(--ink);border-radius:6px;background:var(--card);padding:8px 12px;font-size:16px;transition:background .25s var(--ease),color .25s var(--ease)}
.q .opts button.ok{background:var(--green);border-color:var(--green);color:#fff}
.q .opts button.no{background:var(--red);border-color:var(--red);color:#fff}
.q .why{margin:0;font-size:15px;color:var(--muted);font-style:italic}
html[lang="mr"] .q .why{font-style:normal}
.notes{padding:14px 18px}
.notes summary{cursor:pointer;font-family:var(--f-sans);font-weight:900;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
html[lang="mr"] .notes summary{letter-spacing:0;text-transform:none;font-size:15px}
.notes ul{margin:10px 0 0;padding-left:20px;font-size:16px}

/* rail */
.rail{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--rail);border-top:2px solid var(--ink);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:9px calc(9px + env(safe-area-inset-bottom, 0px))}
.rail-in{max-width:1180px;margin:0 auto;display:flex;gap:8px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.rail .brand b{display:block;font-weight:900;font-size:13.5px;letter-spacing:.2em;text-transform:uppercase}
.rail .brand span{font-weight:600;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rail .steps{display:flex;gap:6px;flex-wrap:wrap}
.rail .steps button{border:1.5px solid var(--ink);background:var(--card);border-radius:3px;font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;transition:background .25s var(--ease),color .25s var(--ease)}
.rail .steps button.done{background:color-mix(in srgb, var(--blue) 25%, var(--card))}
.rail .steps button[aria-current="true"]{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 2px var(--ink)}
.rail .nav{display:flex;gap:6px}
html[lang="mr"] .rail .steps button{font-size:13px;font-weight:700}
@media (max-width:700px){.rail .brand{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="wrap top">
  <div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <a class="btn ghost" id="homeBtn" href="#" hidden></a>
    <div class="seg" role="group" aria-label="Language"><button id="lgEn">EN</button><button id="lgMr">मराठी</button></div>
  </div>
</header>
<main class="wrap stage" id="stage"></main>
<nav class="rail" id="rail" hidden aria-label="Lesson steps">
  <div class="rail-in">
    <div class="brand"><b id="rbrand"></b><span id="rsub"></span></div>
    <div class="steps" id="rsteps"></div>
    <div class="nav"><button class="btn ghost" id="prev">←</button><button class="btn" id="next">→</button></div>
  </div>
</nav>

const W = {
  grid(el){
    const uses = [
      {k:"agri", c:"#e7c53a", n:{en:"Farmland",mr:"शेतजमीन"}}, {k:"fallow", c:"#c9b28a", n:{en:"Fallow",mr:"पडीक"}},
      {k:"forest", c:"#3e8a4f", n:{en:"Forest / pasture",mr:"वन / गायरान"}}, {k:"homes", c:"#d1543a", n:{en:"Houses (gaothan)",mr:"घरे (गावठाण)"}},
      {k:"water", c:"#3b6fd6", n:{en:"Water",mr:"पाणी"}}, {k:"road", c:"#6b675d", n:{en:"Roads",mr:"रस्ते"}}, {k:"public", c:"#8a5cc7", n:{en:"School, temple, office",mr:"शाळा, मंदिर, कार्यालय"}}];
    let cur = "agri", cells = Array(100).fill(null);
    el.innerHTML = `<div class="pal" id="pal">${uses.map(u => `<button data-k="${u.k}" aria-pressed="${u.k===cur}"><i style="background:${u.c}"></i>${esc(L(u.n))}</button>`).join("")}<button id="clr">${esc(L(UI.reset))}</button></div>
      <div class="wflex"><div class="lgrid" id="lg" style="flex:1 1 280px">${cells.map((_, i) => `<button data-i="${i}" aria-label="square ${i+1}"></button>`).join("")}</div><div class="bars" id="lb" style="flex:1 1 240px"></div></div>`;
    const paint = () => {
      el.querySelectorAll("#lg button").forEach(b => { const u = uses.find(x => x.k === cells[b.dataset.i]); b.style.background = u ? u.c : ""; });
      el.querySelector("#lb").innerHTML = uses.map(u => { const n = cells.filter(c => c === u.k).length;
        return `<div class="bar"><span>${esc(L(u.n))}</span><span class="tr"><i style="width:${n}%;background:${u.c};animation:none;transition:width .3s"></i></span><span class="v">${DEV(n)}%</span></div>`; }).join("");
    };
    let down = false;
    el.querySelector("#lg").addEventListener("pointerdown", e => { const b = e.target.closest("[data-i]"); if (!b) return; down = true; cells[b.dataset.i] = cells[b.dataset.i] === cur ? null : cur; paint(); });
    el.querySelector("#lg").addEventListener("pointerover", e => { if (!down) return; const b = e.target.closest("[data-i]"); if (b){ cells[b.dataset.i] = cur; paint(); } });
    window.addEventListener("pointerup", () => down = false);
    el.querySelectorAll("#pal [data-k]").forEach(b => b.onclick = () => { cur = b.dataset.k; el.querySelectorAll("#pal [data-k]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
    el.querySelector("#clr").onclick = () => { cells.fill(null); paint(); };
    paint();
  },
  tally(el){
    const f = [{k:"m",n:{en:"Men and boys",mr:"पुरुष व मुले"}},{k:"f",n:{en:"Women and girls",mr:"स्त्रिया व मुली"}},{k:"a0",n:{en:"Age 0–14",mr:"वय ०–१४"}},{k:"a1",n:{en:"Age 15–59",mr:"वय १५–५९"}},{k:"a2",n:{en:"Age 60+",mr:"वय ६०+"}}];
    const v = {m:0,f:0,a0:0,a1:0,a2:0};
    el.innerHTML = `<div class="tally">${f.map(x => `<div><span>${esc(L(x.n))}</span><div class="ctl"><button data-k="${x.k}" data-d="-1" aria-label="minus">−</button><output id="o-${x.k}">0</output><button data-k="${x.k}" data-d="1" aria-label="plus">+</button><button data-k="${x.k}" data-d="10" aria-label="plus ten" style="width:auto;padding:0 6px;font-size:13px">+10</button></div></div>`).join("")}</div>
      <div class="wflex"><div><span class="k" style="font-family:var(--f-sans);font-weight:800">${esc(L({en:"Our sex ratio",mr:"आपले लिंग गुणोत्तर"}))}</span><div class="big" id="sr">—</div><p class="src" id="srn"></p></div><div class="bars" id="ages" style="flex:1 1 260px"></div></div>`;
    const upd = () => {
      f.forEach(x => el.querySelector("#o-"+x.k).textContent = DEV(v[x.k]));
      const sr = v.m ? Math.round(v.f / v.m * 1000) : null;
      el.querySelector("#sr").textContent = sr == null ? "—" : DEV(sr);
      el.querySelector("#srn").textContent = sr == null ? "" : L({en:`women per 1,000 men · Sangli 966 · India 943`, mr:`दर १,००० पुरुषांमागे स्त्रिया · सांगली ९६६ · भारत ९४३`});
      const tot = v.a0 + v.a1 + v.a2 || 1;
      el.querySelector("#ages").innerHTML = [["a0","var(--amber)"],["a1","var(--blue)"],["a2","var(--red)"]].map(([k,c]) => `<div class="bar"><span>${esc(L(f.find(x=>x.k===k).n))}</span><span class="tr"><i style="width:${v[k]/tot*100}%;background:${c};animation:none;transition:width .3s"></i></span><span class="v">${DEV(Math.round(v[k]/tot*100))}%</span></div>`).join("");
    };
    el.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { v[b.dataset.k] = Math.max(0, v[b.dataset.k] + +b.dataset.d); upd(); });
    upd();

  idl(el){
    const days = {en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], mr:["रवि","सोम","मंगळ","बुध","गुरु","शुक्र","शनि"]};
    let utc = 18*60;
    el.innerHTML = `<div class="idl-ctl"><label for="utc">${esc(L({en:"Time at Greenwich (0°), Monday:",mr:"ग्रीनिच (०°) येथील वेळ, सोमवार:"}))}</label><input type="range" id="utc" min="0" max="1439" step="15" value="${utc}"><b id="utcv"></b></div>
      <div class="idl-wrap"><div class="idl" id="strip"></div></div>
      <div class="row" style="gap:8px">${[{en:"Blue: Monday",mr:"निळा: सोमवार"},{en:"Yellow: Tuesday",mr:"पिवळा: मंगळवार"},{en:"Red: Sunday",mr:"लाल: रविवार"}].map(c => `<span class="chip">${esc(L(c))}</span>`).join("")}</div>`;
    const fmt = m => { m = ((m % 1440) + 1440) % 1440; const h = Math.floor(m/60), mm = m%60; return DEV(String(h).padStart(2,"0") + ":" + String(mm).padStart(2,"0")); };
    const draw = () => {
      el.querySelector("#utcv").textContent = fmt(utc);
      const cols = [];
      for (let lon = -180; lon <= 180; lon += 15){
        const local = utc + lon*4, day = Math.floor(local / 1440);   /* 0 = Monday, 1 = Tuesday, -1 = Sunday */
        const cls = day > 0 ? "d1" : day < 0 ? "dm" : "d0";
        const dn = days[LANG][(1 + day + 7) % 7];
        const lab = lon === 0 ? "0°" : (Math.abs(lon) + "°" + (lon < 0 ? (LANG==="mr"?"प":"W") : (LANG==="mr"?"पू":"E")));
        cols.push(`<div class="${cls}"><span>${DEV(lab)}</span><b>${fmt(local)}</b><span>${dn}</span></div>`);
      }
      el.querySelector("#strip").innerHTML = cols.join("");
    };
    el.querySelector("#utc").oninput = e => { utc = +e.target.value; draw(); };
    draw();
  },
  sort(el){
    const S = [{en:"Primary",mr:"प्राथमिक"},{en:"Secondary",mr:"द्वितीयक"},{en:"Tertiary",mr:"तृतीयक"}];
    const jobs = [[{en:"Grape farmer",mr:"द्राक्ष बागायतदार"},0],[{en:"Shepherd",mr:"मेंढपाळ"},0],[{en:"Sugar factory worker",mr:"साखर कारखान्यातील कामगार"},1],[{en:"Teacher",mr:"शिक्षक"},2],[{en:"Brick kiln worker",mr:"वीटभट्टी कामगार"},1],
      [{en:"Bus conductor",mr:"बस वाहक"},2],[{en:"Dairy farmer",mr:"दुग्ध व्यावसायिक"},0],[{en:"Tailor",mr:"शिंपी"},1],[{en:"Shopkeeper",mr:"दुकानदार"},2],[{en:"Mason (builds houses)",mr:"गवंडी"},1],[{en:"Nurse",mr:"परिचारिका"},2],[{en:"Fisher at the tank",mr:"तलावातील मच्छीमार"},0]];
    let right = 0, tried = 0;
    el.innerHTML = `<div class="sort">${jobs.map(([n], i) => `<div class="it"><span>${esc(L(n))}</span><div class="opts">${S.map((s, j) => `<button data-i="${i}" data-j="${j}">${esc(L(s))}</button>`).join("")}</div></div>`).join("")}</div><div class="chip" id="sc"></div>`;
    const done = new Set();
    const sc = () => el.querySelector("#sc").textContent = `${L(UI.score)}: ${DEV(right)} / ${DEV(jobs.length)}`;
    el.querySelectorAll(".opts button").forEach(b => b.onclick = () => {
      const i = +b.dataset.i, j = +b.dataset.j; if (done.has(i)) return; done.add(i);
      const ok = jobs[i][1] === j; if (ok) right++;
      b.classList.add(ok ? "ok" : "no");
      if (!ok) el.querySelector(`.opts button[data-i="${i}"][data-j="${jobs[i][1]}"]`).classList.add("ok");
      sc();
    });
    sc();
  },
  patterns(el){
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const dots = (pts, extra) => `<svg viewBox="0 0 220 140" role="img">${extra||""}${pts.map(([x,y]) => `<rect x="${x-3.5}" y="${y-3.5}" width="7" height="7" fill="var(--red)" stroke="var(--ink)" stroke-width=".8"/>`).join("")}</svg>`;
    const compact = Array.from({length:46}, () => { const a = rnd()*6.28, r = Math.sqrt(rnd())*34; return [110 + Math.cos(a)*r*1.3, 70 + Math.sin(a)*r]; });
    const dispersed = Array.from({length:22}, () => [14 + rnd()*192, 12 + rnd()*116]);
    const linear = Array.from({length:30}, (_, i) => { const x = 10 + i*7, y = 70 + Math.sin(x/30)*18; return [x, y + (i%2 ? -11 : 11)]; });
    const road = `<path d="${Array.from({length:23}, (_, i) => { const x = i*10; return (i?"L":"M") + x + "," + (70 + Math.sin(x/30)*18).toFixed(1); }).join("")}" fill="none" stroke="var(--blue)" stroke-width="5"/>`;
    const well = `<circle cx="110" cy="70" r="7" fill="var(--blue)" stroke="var(--ink)"/>`;
    const C = [
      {h:{en:"Compact (nucleated)",mr:"केंद्रित"}, s:dots(compact, well), p:{en:"Houses close together around a well, tank or temple. Common on fertile plains with one water source, like many Deccan villages.",mr:"विहीर, तलाव किंवा मंदिराभोवती जवळजवळ घरे. एकाच जलस्रोताच्या सुपीक मैदानी भागात, उदा. दख्खनमधील अनेक गावे."}},
      {h:{en:"Dispersed (scattered)",mr:"विखुरलेली"}, s:dots(dispersed), p:{en:"Houses far apart, each near its own fields. Common in hilly, forested or rugged areas, such as the Konkan hills or the Amazon.",mr:"घरे दूर दूर, प्रत्येक आपापल्या शेताजवळ. डोंगराळ, जंगलव्याप्त भागात, उदा. कोकणातील डोंगर किंवा ॲमेझॉन."}},
      {h:{en:"Linear",mr:"रेषीय"}, s:dots(linear, road), p:{en:"Houses in a line along a road, river, canal or coast. Common along highways and in river valleys.",mr:"रस्ता, नदी, कालवा किंवा किनाऱ्याच्या बाजूने रांगेत घरे. महामार्ग व नदीखोऱ्यांत आढळतात."}}];
    el.innerHTML = C.map(c => `<div class="card"><h3 style="margin:0;font-size:21px">${esc(L(c.h))}</h3>${c.s}<p style="margin:0;font-size:15.5px">${esc(L(c.p))}</p></div>`).join("");
  }
};

/* ===================== RENDER ===================== */
const fmtWeek = iso => { const d = new Date(iso + "T00:00:00"); return LANG === "mr" ? DEV(d.getDate()) + " " + ["जानेवारी","फेब्रुवारी","मार्च","एप्रिल","मे","जून","जुलै","ऑगस्ट","सप्टेंबर","ऑक्टोबर","नोव्हेंबर","डिसेंबर"][d.getMonth()] : d.toLocaleDateString("en-GB", {day:"numeric", month:"short"}); };
let cur = {id:null, i:0};
function home(){
  document.title = "Geography Lab Term 2 Lessons";
  $("#eyebrow").textContent = L(UI.homeEyebrow); $("#title").innerHTML = L(UI.homeTitle);
  $("#homeBtn").hidden = true; $("#rail").hidden = true;
  const weeks = [...new Set(LESSONS.flatMap(l => l.weeks))].sort();
  $("#stage").innerHTML = `<p class="home-intro">${esc(L(UI.intro))}</p><div class="weeks">${weeks.map(w => `<section class="week"><h3>${esc(L(UI.weekOf))} ${esc(fmtWeek(w))}</h3><div class="lcards">${LESSONS.filter(l => l.weeks.includes(w)).map(l => `<a class="card lcard" href="#${l.id}"><div class="row"><span class="g-chip">${esc(L(UI.grade))} ${DEV(l.grade)}</span>${l.weeks.length>1?`<span class="g-chip" style="border-style:dashed">${DEV(l.weeks.indexOf(w)+1)}/${DEV(l.weeks.length)}</span>`:""}</div><h2>${esc(L(l.topic))}</h2><p>${esc(L(l.blurb))}</p><span class="btn" style="align-self:flex-start">${esc(L(UI.open))}</span></a>`).join("")}</div></section>`).join("")}</div>`;
}
function lesson(id, i){
  const l = LESSONS.find(x => x.id === id); if (!l){ home(); return; }
  cur = {id, i: Math.max(0, Math.min(l.slides.length - 1, i))};
  const s = l.slides[cur.i];
  $("#eyebrow").textContent = L(s.eyebrow); $("#title").innerHTML = L(s.title);
  $("#homeBtn").hidden = false; $("#homeBtn").textContent = "← " + L(UI.all);
  let body = s.quiz ? quizHTML(s.quiz) : s.body();
  const notes = cur.i === l.slides.length - 1 ? `<details class="card notes" open><summary>${esc(L(UI.notes))}</summary><ul>${(LANG==="mr"?l.notes.mr:l.notes.en).map(n => `<li>${esc(n)}</li>`).join("")}</ul></details>` : "";
  $("#stage").innerHTML = `<section class="slide enter">${body}${notes}</section>`;
  if (s.widget) W[s.widget]($("#w"));
  if (s.quiz) bindQuiz(s.quiz);
  $("#rail").hidden = false;
  $("#rbrand").textContent = L(UI.brand); $("#rsub").textContent = `${L(UI.grade)} ${DEV(l.grade)} · ${L(l.topic)}`;
  $("#rsteps").innerHTML = l.slides.map((x, j) => `<button aria-current="${j===cur.i}" class="${j<cur.i?"done":""}" data-j="${j}">${DEV(j+1)}. ${esc(L(x.step))}</button>`).join("");
  $("#rsteps").querySelectorAll("button").forEach(b => b.onclick = () => go(id, +b.dataset.j));
  $("#prev").disabled = cur.i === 0; $("#next").disabled = cur.i === l.slides.length - 1;
}
function quizHTML(qs){ return qs.map((q, n) => `<div class="card q" data-n="${n}"><h3>${DEV(n+1)}. ${esc(L(q.q))}</h3><div class="opts">${q.o.map((o, j) => `<button data-j="${j}">${esc(L(o))}</button>`).join("")}</div><p class="why" hidden></p></div>`).join("") + `<div class="chip" id="qs"></div>`; }
function bindQuiz(qs){
  let score = 0, answered = 0;
  const upd = () => $("#qs").textContent = `${L(UI.score)}: ${DEV(score)} / ${DEV(qs.length)}`;
  document.querySelectorAll(".q").forEach(card => {
    const q = qs[+card.dataset.n];
    card.querySelectorAll("button").forEach(b => b.onclick = () => {
      if (card.dataset.done) return; card.dataset.done = 1; answered++;
      const ok = +b.dataset.j === q.a; if (ok) score++;
      b.classList.add(ok ? "ok" : "no"); if (!ok) card.querySelector(`button[data-j="${q.a}"]`).classList.add("ok");
      const w = card.querySelector(".why"); w.hidden = false; w.textContent = `${L(ok ? UI.right : UI.wrong)} ${L(q.why)}`;
      upd();
    });
  });
  upd();
}
function go(id, i){ location.hash = id + (i ? "-s" + (i+1) : ""); }
function route(){
  const h = location.hash.slice(1); const m = h.match(/^(.*?)(?:-s(\d+))?$/);
  if (m && LESSONS.some(l => l.id === m[1])) lesson(m[1], m[2] ? +m[2] - 1 : 0); else home();
  window.scrollTo({top:0, behavior:"smooth"});
}
function setLang(l){ LANG = l; document.documentElement.lang = l; try { localStorage.setItem("lab-lang", l); } catch(e) {}
  $("#lgEn").setAttribute("aria-pressed", l==="en"); $("#lgMr").setAttribute("aria-pressed", l==="mr"); route(); }
$("#lgEn").onclick = () => setLang("en"); $("#lgMr").onclick = () => setLang("mr");
$("#homeBtn").onclick = e => { e.preventDefault(); location.hash = ""; home(); };
$("#prev").onclick = () => go(cur.id, cur.i - 1); $("#next").onclick = () => go(cur.id, cur.i + 1);
document.addEventListener("keydown", e => { if (!cur.id || $("#rail").hidden || /input|textarea/i.test(e.target.tagName)) return;
  const l = LESSONS.find(x => x.id === cur.id); if (e.key === "ArrowRight" && cur.i < l.slides.length-1) go(cur.id, cur.i+1); if (e.key === "ArrowLeft" && cur.i > 0) go(cur.id, cur.i-1); });
window.addEventListener("hashchange", route);
setLang(LANG);
</script>

</body>
</html>
