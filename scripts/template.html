<title>SCOPE India Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500&family=Archivo:wght@500;600;700;800;900&family=Mukta:wght@400;500;600;700;800&family=Tiro+Devanagari+Marathi:ital@0;1&display=swap">
<style>
/* Layout: a lesson board on warm grid paper — serif headline with a highlighter word, outlined cards, black fact chips */
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#0f1b2d; --muted:#5a6678; --line:#d9dee7; --soft:#f4f6f9;
  --accent:#0b5f73; --accent-ink:#ffffff; --good:#1f8a52; --bad:#c23b3b; --focus:#e08a00;
  --z-N:#3a6db5; --z-C:#c9822a; --z-E:#2b9677; --z-W:#c04b55; --z-S:#7656b0; --z-NE:#5c8c2a;
  --s0:#e3edf1; --s1:#c3dbe4; --s2:#9cc4d4; --s3:#6fa8bf; --s4:#458aa6; --s5:#236b88; --s6:#0c4b66;
  --dim:.28; --ghost:#dde2ea; --bg-map:#ffffff; --ocean:#f2f6fa; --shadow:0 1px 2px rgba(15,27,45,.06),0 4px 16px rgba(15,27,45,.05);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3","Mukta",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mr:"Mukta","Noto Sans Devanagari","Source Sans 3",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c131c; --panel:#141e2a; --ink:#e7edf4; --muted:#93a1b3; --line:#263445; --soft:#1a2634;
  --accent:#5cc2d6; --accent-ink:#06222a; --good:#4cc07f; --bad:#ff7b7b; --focus:#ffb547;
  --z-N:#6f9ee6; --z-C:#e8a650; --z-E:#4fc29f; --z-W:#ec7b84; --z-S:#a58ae0; --z-NE:#8fbd55;
  --s0:#1c2c3a; --s1:#1e4152; --s2:#22586c; --s3:#2b7189; --s4:#3c8ea6; --s5:#5aadc2; --s6:#8fd3e2;
  --dim:.22; --ghost:#223040; --bg-map:#141e2a; --ocean:#101924; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c131c; --panel:#141e2a; --ink:#e7edf4; --muted:#93a1b3; --line:#263445; --soft:#1a2634;
  --accent:#5cc2d6; --accent-ink:#06222a; --good:#4cc07f; --bad:#ff7b7b; --focus:#ffb547;
  --z-N:#6f9ee6; --z-C:#e8a650; --z-E:#4fc29f; --z-W:#ec7b84; --z-S:#a58ae0; --z-NE:#8fbd55;
  --s0:#1c2c3a; --s1:#1e4152; --s2:#22586c; --s3:#2b7189; --s4:#3c8ea6; --s5:#5aadc2; --s6:#8fd3e2;
  --dim:.22; --ghost:#223040; --bg-map:#141e2a; --ocean:#101924; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
:root{--z-AS:var(--z-C);--z-AF:var(--z-E);--z-EU:var(--z-N);--z-NA:var(--z-W);--z-SA:var(--z-NE);--z-OC:var(--z-S);--z-BL:var(--z-N);--z-MY:var(--z-S);--z-BG:var(--z-W);--z-KB:var(--z-C);--z-KK:var(--z-N);--z-PN:var(--z-S);--z-NS:var(--z-W);--z-AU:var(--z-C);--z-AM:var(--z-E);--z-NG:var(--z-NE)}
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crumb button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;font-weight:700;font-size:13px}
.hint{font-size:12.5px;color:var(--muted)}
.drill{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 12px;font-weight:700;font-size:14px;align-self:flex-start}
.home{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--focus);color:#1b1205}
#map .homepin{fill:var(--focus);stroke:var(--ink);stroke-width:1.2px;vector-effect:non-scaling-stroke;pointer-events:none}
[hidden]{display:none!important}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 32px}
html[lang="mr"] body{font-family:var(--f-mr)}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;border-bottom:3px solid var(--ink);padding-bottom:10px}
.eyebrow{font-family:var(--f-display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,5vw,52px);line-height:.95;margin:2px 0 0;letter-spacing:.005em;text-transform:uppercase}
h1 small{font-size:.42em;color:var(--muted);font-weight:600;letter-spacing:.06em;margin-left:8px;vertical-align:.35em}
.controls{display:flex;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.seg button{border:0;background:none;padding:7px 13px;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:disabled{cursor:not-allowed;color:var(--muted)}
.soon{font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:0 4px}

/* metric tabs */
.metrics{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.metrics button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.metrics button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* balance */
.balance{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px 14px;display:flex;flex-direction:column;gap:10px}
.bal-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.bal-title{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,28px);line-height:1.05;text-transform:uppercase;text-wrap:balance;margin:0}
html[lang="mr"] .bal-title{font-family:var(--f-mr);text-transform:none}
.bal-big{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.4vw,40px);line-height:1}
.bal-big span{display:block;font-size:13px;font-family:var(--f-body);font-weight:600;color:var(--muted);text-align:right}
.bar{position:relative;display:flex;height:46px;border-radius:6px;overflow:visible;background:var(--soft)}
.bar .seg2{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--f-display);font-weight:700;font-size:17px;border-right:2px solid var(--panel);cursor:pointer;min-width:0;overflow:hidden;white-space:nowrap;transition:opacity .15s}
.bar .seg2:first-child{border-radius:6px 0 0 6px}.bar .seg2:last-child{border-radius:0 6px 6px 0;border-right:0}
.bar .seg2.off{opacity:.3}
.bar{margin-top:14px}
@media (max-width:500px){.bar .seg2{font-size:13px}}
.half{position:absolute;left:50%;top:-8px;bottom:-8px;width:0;border-left:2px dashed var(--ink);pointer-events:none}
.half span{position:absolute;top:-16px;left:0;transform:translateX(-50%);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;background:var(--panel);padding:0 4px}
.zchips{display:flex;flex-wrap:wrap;gap:6px 14px}
.zchip{display:flex;align-items:center;gap:7px;border:0;background:none;padding:3px 2px;font-size:14px;border-radius:6px}
.zchip i{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.zchip b{font-variant-numeric:tabular-nums}
.zchip.off{opacity:.45}
.strip{position:relative;height:64px;margin:6px 6px 0}
.strip .axis{position:absolute;left:0;right:0;top:30px;height:2px;background:var(--line)}
.strip .dot{position:absolute;top:22px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid var(--panel);cursor:pointer;padding:0}
.strip .dot.sel{width:20px;height:20px;margin-left:-10px;top:19px;border-color:var(--ink)}
.strip .avg{position:absolute;top:6px;bottom:6px;border-left:2px dashed var(--ink)}
.strip .avg span{position:absolute;top:-6px;left:4px;font-size:11px;font-weight:700;white-space:nowrap;letter-spacing:.04em;text-transform:uppercase}
.strip .tick{position:absolute;top:40px;font-size:12px;color:var(--muted);transform:translateX(-50%)}
.strip .tick:first-of-type{transform:none}
.extremes{display:flex;gap:8px 22px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.extremes b{color:var(--ink)}

/* main grid */
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.lay-world .wrap{max-width:1680px}
.lay-world .grid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
@media (max-width:860px){.lay-world .grid{grid-template-columns:minmax(0,1fr)}}
html:not(.lay-world) .mapbox{height:auto;background:none;overflow:visible}
html:not(.lay-world) #map{height:auto;max-height:76vh;touch-action:auto;cursor:default}
html:not(.lay-world) .zoomctl, html:not(.lay-world) .readout, html:not(.lay-world) .wheelhint{display:none!important}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border-radius:12px;box-shadow:var(--shadow)}
.mapcard{padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.maphead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.maphead h2{font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.02em;margin:0}
html[lang="mr"] .maphead h2{font-family:var(--f-mr);text-transform:none}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:7px 14px;font-weight:700;font-size:14px}
.btn.ghost{background:none;color:var(--ink)}
.mapbox{position:relative;height:max(420px, calc(100vh - 290px));border-radius:10px;overflow:hidden;background:var(--soft)}
@media (max-width:700px){.mapbox{height:66vh;min-height:340px}}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}
.mapcard:fullscreen{border-radius:0;overflow:auto;padding:14px max(14px, env(safe-area-inset-right, 0px)) 14px max(14px, env(safe-area-inset-left, 0px))}
.mapcard:fullscreen .mapbox{height:calc(100vh - 150px)}
.zoomctl{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow);z-index:2}
.zoomctl button{width:36px;height:36px;border:0;border-bottom:1px solid var(--line);background:none;font-size:19px;font-weight:700;line-height:1}
.zoomctl button:last-child{border-bottom:0;font-size:16px}
.zoomctl button:hover{background:var(--soft)}
.wheelhint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb, var(--ink) 45%, transparent);color:#fff;font-size:18px;font-weight:700;pointer-events:none;z-index:3;text-align:center;padding:16px}
.readout{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);display:flex;gap:10px;align-items:baseline;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow);text-align:left;z-index:2}
.readout b{font-family:var(--f-display);font-size:19px;text-transform:uppercase;letter-spacing:.02em}
html[lang="mr"] .readout b{font-family:var(--f-mr);text-transform:none}
.readout span{font-size:14px;color:var(--muted);white-space:nowrap}
.readout em{font-style:normal;font-size:12px;color:var(--accent);font-weight:700;white-space:nowrap}
#map path{stroke:var(--panel);stroke-width:.8px;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer;transition:opacity .15s,fill .25s}
#map path:hover{stroke:var(--ink);stroke-width:1.2px}
#map path.sel{stroke:var(--ink);stroke-width:2.2px}
#map path.ghost{fill:var(--ghost);stroke:var(--panel);cursor:default}
#map path.sphere{fill:var(--ocean);stroke:var(--line);stroke-width:1px;cursor:default}
#map path.sphere:hover{stroke:var(--line);stroke-width:1px}
#map circle.wdot{stroke:var(--ink);stroke-width:.8px;vector-effect:non-scaling-stroke;cursor:pointer}
#map circle.wdot.sel{stroke-width:2.2px}
#map path.ghost:hover{stroke:var(--panel);stroke-width:.8px}
#map path.ghostd{opacity:.42;stroke:var(--panel);cursor:pointer}
#map path.ghostd:hover{opacity:.85;stroke:var(--ink)}
#map .border{fill:none;stroke:var(--ink);stroke-width:1.6px;pointer-events:none;stroke-dasharray:5 3;opacity:.55}
#map .nblabel{fill:var(--muted);font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;pointer-events:none;paint-order:stroke;stroke:var(--bg-map);stroke-width:3px;vector-effect:non-scaling-stroke}
.nbtoggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;margin-left:6px;white-space:nowrap}
#map path.dim,#map circle.dim{opacity:var(--dim)}
#map path:focus-visible{outline:none;stroke:var(--focus);stroke-width:2.4}
#map .ldmark{stroke:var(--ink);stroke-width:1px;vector-effect:non-scaling-stroke;cursor:pointer}
#map .ldlabel{fill:var(--muted);font-family:var(--f-body)}
.flash-ok{animation:ok .9s ease 2}.flash-no{animation:no .9s ease 1}
@keyframes ok{50%{fill:var(--good)}}@keyframes no{50%{fill:var(--bad)}}
@media (prefers-reduced-motion:reduce){.flash-ok,.flash-no{animation:none}*{transition:none!important}}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:7px 10px;font-size:13px;line-height:1.3;max-width:220px;box-shadow:var(--shadow);z-index:3}
#tip b{display:block;font-size:14px}
.legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend .ramp{display:flex;flex:1 1 260px;min-width:0}
.legend .ramp div{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.legend .ramp i{height:10px;display:block}
.legend .ramp span{font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smalls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.smalls button{border:1px solid var(--line);border-radius:6px;padding:4px 8px 4px 5px;background:var(--panel);display:flex;gap:6px;align-items:center;font-size:12px;font-weight:600}
.smalls button i{width:14px;height:14px;border-radius:3px;display:block}
.smalls button.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

/* quiz */
.quiz{border:2px solid var(--accent);border-radius:10px;padding:10px 12px;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;background:var(--soft)}
.quiz .q{font-weight:700;font-size:17px;flex:1 1 240px}
.quiz .score{font-family:var(--f-display);font-weight:700;font-size:22px}
.quiz .fb{flex-basis:100%;font-size:14px;min-height:1.2em}
.quiz .fb.ok{color:var(--good)}.quiz .fb.no{color:var(--bad)}

/* side */
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.detail{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.d-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.d-name{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;text-transform:uppercase;margin:0}
html[lang="mr"] .d-name{font-family:var(--f-mr);text-transform:none;font-size:28px}
.d-alt{font-size:15px;color:var(--muted);margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff;white-space:nowrap}
.d-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.d-meta b{color:var(--ink);font-weight:600}
.note{font-size:13.5px;background:var(--soft);border-left:3px solid var(--focus);padding:8px 10px;border-radius:0 6px 6px 0}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.stats{grid-template-columns:minmax(0,1fr)}}
.stat{border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:3px;cursor:pointer;background:none;text-align:left}
.stat.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stat .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
html[lang="mr"] .stat .k{text-transform:none;letter-spacing:0;font-size:13px}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .r{font-size:12.5px;color:var(--muted)}
.cmp{position:relative;height:6px;background:var(--soft);border-radius:3px;margin-top:3px}
.cmp i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.cmp u{position:absolute;top:-3px;bottom:-3px;border-left:2px solid var(--ink)}
.rank{padding:14px 14px 8px}
.rankhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.rankhead h3{font-family:var(--f-display);font-weight:700;font-size:18px;text-transform:uppercase;margin:0}
html[lang="mr"] .rankhead h3{font-family:var(--f-mr);text-transform:none}
.rankhead button{border:1px solid var(--line);background:none;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600}
#rank{list-style:none;margin:0;padding:0;max-height:560px;overflow-y:auto}
#rank li button{width:100%;display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;border:0;background:none;padding:5px 4px;border-radius:6px;text-align:left}
#rank li button:hover{background:var(--soft)}
#rank li button.sel{background:var(--soft);box-shadow:inset 3px 0 0 var(--ink)}
#rank .rn{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
#rank .nm{display:flex;flex-direction:column;gap:3px;min-width:0}
#rank .nm span{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rank .nm i{display:block;height:5px;border-radius:3px}
#rank .val{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.src{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.src a{color:var(--accent)}
.src p{margin:0;max-width:110ch}

/* ===== Paper & highlighter theme ===== */
:root{
  --bg:#ebe6da; --paper-hi:#f6f2e8; --grid:rgba(40,36,28,.05); --panel:#fbf9f4; --ink:#15171c; --muted:#6b675d; --line:#d8d1c1; --soft:#f2eee4;
  --accent:#3b6fd6; --accent-ink:#ffffff; --good:#2f8a4f; --bad:#c9452f; --focus:#c98e00; --hl:#f7d548; --chip:#15171c; --chip-ink:#ffffff; --red:#d1543a; --blue:#3b6fd6;
  --s0:#e5dfd1; --s1:#c9ccca; --s2:#a2b2c3; --s3:#7895bb; --s4:#4f74aa; --s5:#2f5390; --s6:#1b3263;
  --ghost:#dcd5c5; --bg-map:#fbf9f4; --ocean:#f5f1e7; --shadow:0 2px 0 rgba(0,0,0,.06),0 12px 26px -16px rgba(60,45,15,.4);
  --f-display:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --f-label:"Archivo","Mukta","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Serif 4","Mukta",Georgia,serif;
  --f-mr:"Mukta","Noto Sans Devanagari",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1a17; --paper-hi:#25231f; --grid:rgba(255,248,230,.045); --panel:#23211d; --ink:#f1ece0; --muted:#a9a293; --line:#3b382f; --soft:#2a2823;

:root[data-theme="dark"]{
  --bg:#1b1a17; --paper-hi:#25231f; --grid:rgba(255,248,230,.045); --panel:#23211d; --ink:#f1ece0; --muted:#a9a293; --line:#3b382f; --soft:#2a2823;
  --accent:#6f9bf0; --accent-ink:#0f1320; --good:#5cc483; --bad:#f08a72; --focus:#f2c94c; --hl:#e8c234; --chip:#f1ece0; --chip-ink:#15171c; --red:#ec7c62; --blue:#6f9bf0;
  --s0:#2b2b2a; --s1:#2c3a4e; --s2:#344f78; --s3:#3f67a1; --s4:#5a86c4; --s5:#86aade; --s6:#c3d6f3;
  --ghost:#302e29; --bg-map:#23211d; --ocean:#201f1b; --shadow:0 2px 0 rgba(0,0,0,.3); color-scheme:dark}
html[lang="mr"]{--f-display:"Tiro Devanagari Marathi","Noto Serif Devanagari",serif; --f-label:"Mukta","Noto Sans Devanagari",sans-serif; --f-body:"Mukta","Noto Sans Devanagari",sans-serif}
body{background:
  radial-gradient(ellipse 70% 55% at 50% 30%, var(--paper-hi), transparent 70%) fixed,
  linear-gradient(var(--grid) 1px, transparent 1px) 0 0/28px 28px,
  linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/28px 28px,
  var(--bg);
  font-size:15.5px}
mark{background:var(--hl);color:#15171c;padding:0 .14em;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--hl);outline-offset:2px}

/* labels: heavy caps sans */
.eyebrow,.metrics button,.seg button,.btn,.drill,.crumb button,.pill,.tag,.home,.stat .k,.rankhead h3,.rankhead button,.zchip,.half span,.bar .seg2,.legend,.smalls button,.extremes,.strip .avg span,.d-meta,.hint,.readout em,#rank .val,.quiz .score{font-family:var(--f-label)}
.eyebrow{font-weight:800;font-size:12.5px;letter-spacing:.2em;color:var(--muted)}
.top{border-bottom:2px solid var(--ink)}
h1{font-family:var(--f-display);font-weight:700;text-transform:none;letter-spacing:-.01em;line-height:1.08;font-size:clamp(32px,4.8vw,52px)}
h1 small{font-family:var(--f-label);font-weight:800;font-size:.26em;letter-spacing:.16em;text-transform:uppercase;vertical-align:.6em}
.seg{border:2px solid var(--ink);border-radius:6px;background:var(--panel)}
.seg button{font-weight:800;font-size:13px;letter-spacing:.04em}
.metrics button{border:2px solid var(--ink);background:var(--panel);border-radius:4px;font-weight:800;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:6px 11px}
.metrics button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 2px var(--ink)}

/* cards */
.card,.balance{background:var(--panel);border:2px solid var(--ink);border-radius:12px;box-shadow:var(--shadow)}
.bal-title,.maphead h2,.d-name,.rankhead h3{font-family:var(--f-display);text-transform:none;letter-spacing:-.005em}
.bal-title{font-weight:700;font-size:clamp(22px,2.6vw,30px)}
.maphead h2{font-weight:700;font-size:21px}
.bal-big{font-family:var(--f-display);font-weight:700}
.bal-big span{font-family:var(--f-label);font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.bar{height:40px;border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--soft)}
.bar .seg2{font-weight:800;font-size:14px;border-right:2px solid var(--ink)}
.bar .seg2:first-child,.bar .seg2:last-child{border-radius:0}
.half{border-left-color:var(--ink)}
.half span{font-weight:800;font-size:10.5px;letter-spacing:.12em;background:var(--hl);color:#15171c;padding:1px 6px;border-radius:2px}
.zchip{font-weight:600;font-size:13.5px}
.zchip i{border-radius:2px}
.strip .dot{border-color:var(--panel)}
.strip .avg span{font-weight:800;letter-spacing:.08em;background:var(--hl);color:#15171c;padding:0 5px;border-radius:2px}
.extremes{font-size:13.5px}
.extremes b{font-family:var(--f-display);font-weight:700;font-size:15px}

/* map */
.mapbox{background:var(--paper-hi)}
html:not(.lay-world) .mapbox{background:none}
#tip{background:var(--chip);color:var(--chip-ink);border-radius:4px;font-family:var(--f-label);font-weight:600}
#tip b{font-family:var(--f-display);font-size:16px}
.zoomctl{border:2px solid var(--ink);border-radius:6px}
.zoomctl button{border-bottom:2px solid var(--ink)}
.readout{border:2px solid var(--ink);border-radius:6px}
.readout b{font-family:var(--f-display);text-transform:none;font-size:20px;font-weight:700}
.readout em{font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
.legend{font-weight:600}
.legend .ramp i{border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.smalls button{border:1.5px solid var(--ink);border-radius:4px;font-weight:700}
.hint{font-family:var(--f-body);font-style:italic;font-size:14px}
html[lang="mr"] .hint{font-style:normal}

/* buttons & chips */
.btn,.drill,.crumb button{background:var(--chip);color:var(--chip-ink);border:2px solid var(--chip);border-radius:4px;font-weight:800;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--ink)}
.drill{background:var(--blue);border-color:var(--blue);color:#fff}
.pill{border-radius:2px;font-weight:800;letter-spacing:.06em;padding:3px 8px}
.home{background:var(--hl);color:#15171c;border-radius:2px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;align-self:flex-start}
.quiz{border:2px solid var(--ink);background:var(--panel);border-radius:10px}
.quiz .q{font-family:var(--f-display);font-size:20px}
.quiz .score{font-weight:900}

/* detail card */
.d-name{font-weight:700;font-size:clamp(28px,3vw,36px);line-height:1.08}
.d-alt{font-family:var(--f-body);font-style:italic}
.d-meta{font-size:13.5px}
.d-meta b{font-family:var(--f-display);font-size:15px}
.note{font-family:var(--f-body);font-style:italic;background:var(--soft);border-left:4px solid var(--hl);font-size:14.5px}
.stat{border:1.5px solid var(--line);border-radius:8px;background:var(--panel)}
.stat.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.stat .k{font-weight:800;font-size:11.5px;letter-spacing:.1em}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:26px}
.stat .r{font-family:var(--f-body);font-style:italic}
.cmp{background:var(--soft);border-radius:2px}
.cmp i{background:var(--blue);border-radius:2px}

/* ranking */
.rankhead h3{font-weight:700;font-size:20px}
.rankhead button{border:1.5px solid var(--ink);border-radius:4px;font-weight:700}
#rank .nm span{font-family:var(--f-display);font-weight:600;font-size:15px}
#rank .nm i{height:6px;border-radius:1px}
#rank .val{font-weight:800}
#rank li button.sel{background:color-mix(in srgb, var(--hl) 35%, transparent);box-shadow:inset 3px 0 0 var(--ink)}

/* sources */
.src{font-family:var(--f-body);border-top:2px solid var(--ink)}
.src strong{font-family:var(--f-label);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px}


/* Devanagari: no tracking or capitals (they break the headline bar of the script) */
html[lang="mr"] .eyebrow,html[lang="mr"] .metrics button,html[lang="mr"] .btn,html[lang="mr"] .drill,html[lang="mr"] .crumb button,html[lang="mr"] .pill,html[lang="mr"] .home,html[lang="mr"] .stat .k,html[lang="mr"] .half span,html[lang="mr"] .strip .avg span,html[lang="mr"] .bal-big span,html[lang="mr"] .readout em,html[lang="mr"] .src strong,html[lang="mr"] h1 small{letter-spacing:0!important;text-transform:none!important}
html[lang="mr"] h1,html[lang="mr"] .d-name,html[lang="mr"] .bal-title,html[lang="mr"] .maphead h2,html[lang="mr"] .rankhead h3,html[lang="mr"] .readout b{font-weight:400;line-height:1.3}
html[lang="mr"] .stat .v,html[lang="mr"] .bal-big{font-weight:400}
html[lang="mr"] .metrics button,html[lang="mr"] .btn,html[lang="mr"] .drill{font-size:14px;font-weight:700}
html[lang="mr"] .stat .k{font-size:13px;font-weight:700}

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="eyebrow">SCOPE · Geography Lab</div>
      <h1 id="h1">India Atlas <small>Census 2011</small></h1>
    </div>
    <div class="controls">

        <button id="lgMr" aria-pressed="false">मराठी</button>
      </div>

  <nav class="metrics" id="metrics" aria-label="Choose what the map shows"></nav>


  <section class="card mapcard" id="mapcard">

      <div class="crumb" id="crumb"></div><h2 id="mapTitle"></h2>
      <button class="btn" id="quizBtn"></button>

    <div class="quiz" id="quiz" hidden></div>
    <div class="hint" id="hint"></div>

        <button id="zIn" aria-label="Zoom in" title="Zoom in">+</button>
        <button id="zOut" aria-label="Zoom out" title="Zoom out">−</button>
        <button id="zReset" aria-label="Reset view" title="Reset view">⟲</button>
        <button id="zFull" aria-label="Full screen" title="Full screen">⛶</button>

      <button class="readout" id="readout" hidden></button>
      <div class="wheelhint" id="wheelHint" hidden></div>
      <div id="tip" hidden></div>

    <div class="legend" id="legend"></div>
    <div class="smalls" id="smalls"></div>
  </section>

  <main class="grid" id="grid">

    </div>
  </main>

  <section class="balance" id="balance" aria-live="polite"></section>


  <aside class="side" id="side"></aside>
  <footer class="src" id="src"></footer>
</div>

const USD_INR = 87.16;  /* World Bank official exchange rate, India, 2025 average (PA.NUS.FCRF) */
function inr(v, short){
  if (!short || v < 1e5) return "₹" + Math.round(v).toLocaleString("en-IN");
  if (v >= 1e7) return "₹" + (v/1e7).toLocaleString("en-IN",{maximumFractionDigits:2}) + " " + t().crore;
  return "₹" + (v/1e5).toLocaleString("en-IN",{maximumFractionDigits:2}) + " " + t().lakh;
}
function fmtBig(n){
  if (n >= 1e7) return (n/1e7).toLocaleString("en-IN",{maximumFractionDigits:2}) + " " + t().crore;
  if (n >= 1e5) return (n/1e5).toLocaleString("en-IN",{maximumFractionDigits:2}) + " " + t().lakh;
  return n.toLocaleString("en-IN");
}
function fmt(m, v, short){
  if (v == null) return "—";
  if (m === "den" && S.level === "world") return v < 10 ? v.toFixed(1) : Math.round(v).toLocaleString("en-IN");
  if (m === "pop") return short ? fmtBig(v) : v.toLocaleString("en-IN");
  if (m === "area") return v.toLocaleString("en-IN") + " km²";
  if (m === "den") return v.toLocaleString("en-IN");
  if (m === "lit") return v.toFixed(2) + "%";
  if (m === "sr") return String(v);
  if (m === "gr") return (v > 0 ? "+" : "") + v.toFixed(2) + "%";
  if (v == null) return "—";
  if (m === "le") return v.toFixed(1) + " " + t().yrs;
  if (m === "gdp") return inr(v, short);
  if (m === "urb" || m === "frs") return v.toFixed(1) + "%";
  return String(v);
}
const zcol = z => `var(--z-${z})`;

/* colour bins: quantiles over the 35 units */
function bins(m){
  const vals = binUnits().filter(u => has(u, m)).map(u => u[m]).sort((a,b)=>a-b);
  const n = 7, cuts = [];
  for (let i=1;i<n;i++) cuts.push(vals[Math.floor(i*vals.length/n)]);
  return {cuts, min:vals[0], max:vals[vals.length-1]};
}
let BIN = null;
const nbStates = () => isDist() && S.showNb ? Object.keys(LEVELS).filter(k => k !== "india" && k !== "world" && k !== S.level) : [];
const binUnits = () => UNITS.concat(...nbStates().map(k => LEVELS[k].units));
function colorOf(u){
  if (S.metric === "zone") return zcol(u.zone);
  if (!has(u, S.metric)) return "var(--ghost)";
  let i = 0; while (i < BIN.cuts.length && u[S.metric] >= BIN.cuts[i]) i++;
  return `var(--s${i})`;
}
function rankOf(u, m){
  if (!has(u, m)) return null;
  return UNITS.filter(x => has(x, m) && x[m] > u[m]).length + 1;
}
const nWith = m => UNITS.filter(x => has(x, m)).length;
function scaleOf(m, list){
  const vals = list.filter(u => has(u, m)).map(u => u[m]);

  const f = v => Math.max(0, Math.min(100, log ? (Math.log10(v)-Math.log10(lo))/(Math.log10(hi)-Math.log10(lo))*100 : (v-lo)/((hi-lo)||1)*100));

function zoomTo(from, to){

/* ---------- pan & zoom ---------- */
const baseVB = () => LEVELS[S.level].vb;
function clampVB(v){

function zoomAt(factor, cx, cy){

let hintT = 0;
svg.addEventListener("wheel", e => {

const ptrs = new Map(); let dragMoved = false, lastPinch = 0, panStart = null;
svg.addEventListener("pointerdown", e => {

svg.addEventListener("pointermove", e => {

function showTip(e, html){

function buildMap(){
  svg.innerHTML = ""; pathEls = []; ghostEls = []; ldMark = null;
  svg.setAttribute("aria-label", isDist() ? `Map of ${LEVELS[S.level].name.en} by district` : "Map of India by State and Union Territory");
  if (S.level === "world"){
    svg.appendChild(svgEl("path", {d:WD.sphere, class:"sphere"}));
    FEAT.filter(f => !f.u).forEach(f => {
      const p = svgEl("path", {d:f.d, class:"ghost"});
      p.addEventListener("pointermove", e => showTip(e, `<b>${esc(S.lang==="mr"&&f.mr?f.mr:f.en)}</b>${esc(t().noData)}`));
      p.addEventListener("pointerleave", hideTip);
      svg.appendChild(p);
    });
  }
  if (isDist() && S.showNb){
    const nb = nbStates();
    /* neighbouring states without district data: plain grey context */
    B.feat.forEach(f => {

      const p = svgEl("path", {d:f.d, class:"ghost"});
      p.addEventListener("pointermove", e => showTip(e, `<b>${esc(ghostName(f))}</b>`));
      p.addEventListener("pointerleave", hideTip);
      svg.appendChild(p); ghostEls.push([p, f, null]);
    });
    /* neighbouring states that have district data: faded districts on the same colour scale */
    nb.forEach(k => {
      const L = LEVELS[k], UU = Object.fromEntries(L.units.map(u => [u.id, u]));
      L.feat.forEach(f => {
        const u = UU[f.u], p = svgEl("path", {d:f.d, class:"ghostd", tabindex:"0", role:"button", "aria-label": `${f.lab||u.en}, ${L.name.en}`});
        p.addEventListener("pointermove", e => {
          if (S.quiz) return;
          const nmD = f.lab ? (S.lang==="mr"?f.mr:f.lab) : nm(u);
          const val = S.metric === "zone" ? "" : esc(fmt(S.metric, u[S.metric], true)) + "<br>";
          showTip(e, `<b>${esc(nmD)}</b>${val}<span style="opacity:.75">${esc(L.name[S.lang==="mr"?"mr":"en"])} · ${S.lang==="mr"?"उघडण्यासाठी क्लिक करा":"click to open"}</span>`);

/* neighbour-state names, put at the middle of the part of each state that is on screen */
function placeLabels(){
  svg.querySelectorAll(".nblabel").forEach(l => l.remove());
  if (zooming || !isDist() || !S.showNb || !curVB) return;
  const [vx, vy, vw, vh] = curVB, k = vw/600, groups = {};
  ghostEls.forEach(([p, f, u, st]) => {
    const key = st || (f.lab ? f.k : f.u);
    const name = st ? LEVELS[st].name[S.lang==="mr"?"mr":"en"] : ghostName(f);
    const b = p.getBBox();
    const g = groups[key] || (groups[key] = {name, x0:Infinity, y0:Infinity, x1:-Infinity, y1:-Infinity});
    g.x0 = Math.min(g.x0, b.x); g.y0 = Math.min(g.y0, b.y); g.x1 = Math.max(g.x1, b.x+b.width); g.y1 = Math.max(g.y1, b.y+b.height);
  });
  Object.values(groups).forEach(g => {
    const x0 = Math.max(g.x0, vx), y0 = Math.max(g.y0, vy), x1 = Math.min(g.x1, vx+vw), y1 = Math.min(g.y1, vy+vh);
    if (x1 - x0 < vw*.12 || y1 - y0 < vh*.06) return;
    const tx = svgEl("text", {class:"nblabel", x:(x0+x1)/2, y:(y0+y1)/2, "text-anchor":"middle", "dominant-baseline":"middle", "font-size":12*k});
    tx.textContent = g.name; svg.appendChild(tx);
  });
}

/* ---------- quiz ---------- */
function newQuestion(){
  const q = S.quiz, r = Math.random();
  if (r < .5){
    const id = FINDABLE[Math.floor(Math.random()*FINDABLE.length)];
    q.cur = {kind:"find", ans:id};
  } else {
    const ms = LEVELS[S.level].metrics, m = ms[Math.floor(Math.random()*ms.length)];
    const states = UNITS.filter(u=>u.type===UNIT_TYPE() && has(u, m)).sort((a,b)=>b[m]-a[m]);
    const most = Math.random() < .55;
    q.cur = {kind: most?"most":"least", m, ans: (most?states[0]:states[states.length-1]).id};
  }
  q.answered = false; q.fb = ""; q.fbCls = "";
  renderQuiz();
}
function qText(){
  const c = S.quiz.cur;
  if (c.kind === "find") return t().find(nm(U[c.ans]));
  const mName = t().metrics[c.m].toLowerCase();
  const w = S.level === "world" ? "c" : isDist(); return c.kind === "most" ? t().most(S.lang==="mr"?t().metrics[c.m]:mName, w) : t().least(S.lang==="mr"?t().metrics[c.m]:mName, w);
}
function renderQuiz(){
  const el = $("#quiz");
  el.hidden = !S.quiz;
  $("#quizBtn").textContent = S.quiz ? t().exitQuiz : t().quiz;
  $("#quizBtn").className = S.quiz ? "btn ghost" : "btn";
  if (!S.quiz || !S.quiz.cur) return;
  const q = S.quiz;
  el.innerHTML = `<div class="q">${esc(qText())}</div>
    <div class="score num">${esc(t().score)} ${q.score}/${q.n}</div>
    ${q.answered ? `<button class="btn" id="nextQ">${esc(t().nextQ)}</button>` : ""}
    <div class="fb ${q.fbCls}" aria-live="polite">${esc(q.fb)}</div>`;
  const nb = $("#nextQ"); if (nb) nb.onclick = newQuestion;
}
function flash(id, cls){
  svg.querySelectorAll(`[data-u="${id}"]`).forEach(p => { p.classList.remove("flash-ok","flash-no"); void p.getBBox(); p.classList.add(cls); setTimeout(()=>p.classList.remove(cls), 1900); });
}
function answer(id){
  const q = S.quiz; if (q.answered) return;
  q.answered = true; q.n++;
  if (id === q.cur.ans){ q.score++; q.fb = t().right + (q.cur.kind!=="find" ? " " + nm(U[id]) + ": " + fmt(q.cur.m, U[id][q.cur.m]) : ""); q.fbCls = "ok"; flash(id, "flash-ok"); }
  else { q.fb = (q.cur.kind==="find" ? t().wrong(nm(U[id])) : t().answerWas(nm(U[q.cur.ans]) + " (" + fmt(q.cur.m, U[q.cur.ans][q.cur.m]) + ")")); q.fbCls = "no"; flash(q.cur.ans, "flash-ok"); flash(id, "flash-no"); }
  renderQuiz();
}
$("#quizBtn").onclick = () => {
  S.quiz = S.quiz ? null : {score:0, n:0};
  if (S.quiz){ S.zoneFilter = null; renderAll(); newQuestion(); } else renderAll();
};

  S.sel = id; renderAll(false);

}

    ${S.level==="world"?"":`    <p>Population, males, females and sex ratio: Census of India 2011, Primary Census Abstract (Office of the Registrar General &amp; Census Commissioner, Ministry of Home Affairs), as reprinted in <a href="https://ecostat.andamannicobar.gov.in/basicstatPDF2024_25/33.populationcensus.pdf" target="_blank" rel="noopener">Basic Statistics 2024-25, Table 32</a>. Literacy rate (age 7+): Census 2011 via <a href="https://education.gov.in/sites/upload_files/mhrd/files/rtise/DOSELR2019530201.pdf" target="_blank" rel="noopener">Ministry of Education, Dept. of School Education &amp; Literacy</a>. Area and decadal growth 2001–2011: Census of India 2011 tables. Density is population ÷ area, except Jammu &amp; Kashmir (official Census figure). Primary source: <a href="https://censusindia.gov.in" target="_blank" rel="noopener">censusindia.gov.in</a>.</p>
    <p>All figures describe India as it was in 2011 (28 States, 7 Union Territories). The map shows today's boundaries: Telangana (formed 2014) uses undivided Andhra Pradesh figures, and Ladakh (separate UT since 2019) uses Jammu &amp; Kashmir figures. The India total of ${INDIA.pop.toLocaleString("en-IN")} excludes three subdivisions of Senapati district, Manipur, whose count was estimated separately; with them the official total is 1,21,08,54,977. Zones follow the Zonal Councils set up under the States Reorganisation Act, 1956, with the North Eastern Council for the North East; Andaman &amp; Nicobar and Lakshadweep are grouped with the Southern zone. Map boundaries follow the Survey of India's depiction of India's territory, from the open <a href="https://github.com/datta07/INDIAN-SHAPEFILES" target="_blank" rel="noopener">INDIAN-SHAPEFILES</a> dataset, simplified for display.</p>`}`;
}

/* ---------- language ---------- */
function setLang(l){
  S.lang = l; document.documentElement.lang = l;
  try { localStorage.setItem("atlas-lang", l); } catch(e) {}
  $("#lgEn").setAttribute("aria-pressed", l==="en"); $("#lgMr").setAttribute("aria-pressed", l==="mr");
  renderAll();
}
$("#lgEn").onclick = () => setLang("en");
$("#scWorld").onclick = () => { if (S.level !== "world") setLevel("world", "IND"); };
$("#scIndia").onclick = () => { if (S.level !== "india") setLevel("india", S.level === "world" ? "mh" : S.level); };
$("#lgMr").onclick = () => setLang("mr");

function applyLayout(){
  const world = S.level === "world";
  const wrap = $(".wrap"), grid = $("#grid"), side = $("#side"), mc = $("#mapcard"), bal = $("#balance"), src = $("#src");
  document.documentElement.classList.toggle("lay-world", world);
  if (world){
    if (mc.parentNode !== wrap || mc.nextElementSibling !== grid){ wrap.insertBefore(mc, grid); grid.append($("#detail"), $("#rankcard")); wrap.insertBefore(bal, src); wrap.insertBefore(side, src); }
  } else if (mc.parentNode !== grid){
    wrap.insertBefore(bal, grid); grid.prepend(mc); side.append($("#detail"), $("#rankcard")); grid.append(side);
  }
}
function renderAll(){
  applyLayout();
  BIN = S.metric === "zone" ? null : bins(S.metric);
  $("#eyebrow").textContent = t().eyebrow;
  $("#h1").innerHTML = `${esc(t().title)} <small>${esc(t().sub)}</small>`;
  $("#scIndia").textContent = t().india; $("#scWorld").textContent = t().world;
  $("#scIndia").setAttribute("aria-pressed", S.level !== "world"); $("#scWorld").setAttribute("aria-pressed", S.level === "world");
  const mrL = S.lang === "mr";
  const place = S.level === "world" ? (mrL ? "जग" : "World") : S.level === "india" ? (mrL ? "भारत" : "India") : LEVELS[S.level].name[mrL ? "mr" : "en"];
  $("#h1").innerHTML = `${mrL ? "भूगोल प्रयोगशाळा" : "Geography Lab"}: <mark>${esc(place)}</mark> <small>${esc(S.level==="world" ? t().wsub : t().sub)}</small>`;
  $("#mapTitle").textContent = S.metric === "zone" ? LV().zones : `${t().metrics[S.metric]} · ${t().units[S.metric]}`;
  $("#crumb").innerHTML = isDist() ? `<button id="backBtn">← ${esc(t().back)}</button><b>${esc(LEVELS[S.level].name[S.lang==="mr"?"mr":"en"])}</b>` : "";
  const bb = $("#backBtn"); if (bb) bb.onclick = () => setLevel("india", S.level);
  $("#wheelHint").textContent = S.lang==="mr" ? "झूम करण्यासाठी Ctrl (Mac वर ⌘) दाबून स्क्रोल करा, किंवा + / − बटणे वापरा" : (/Mac/.test(navigator.platform) ? "Hold ⌘ and scroll to zoom, or use + and −" : "Hold Ctrl and scroll to zoom, or use + and −");
  $("#hint").innerHTML = esc(LV().hint) + (isDist() ? ` <label class="nbtoggle"><input type="checkbox" id="nbToggle" ${S.showNb?"checked":""}> ${S.lang==="mr"?"शेजारची राज्ये दाखवा":"Show neighbouring states"}</label>` : "");
  const nt = $("#nbToggle"); if (nt) nt.onchange = () => { S.showNb = nt.checked; buildMap(); renderAll(); };
  renderTabs(); renderBalance(); paintMap(); renderLegend(); renderSmalls(); renderDetail(); renderRank(); renderQuiz(); renderSrc();
}
document.documentElement.lang = S.lang;
$("#lgEn").setAttribute("aria-pressed", S.lang==="en"); $("#lgMr").setAttribute("aria-pressed", S.lang==="mr");
setLevel("india", "mh");
</script>
